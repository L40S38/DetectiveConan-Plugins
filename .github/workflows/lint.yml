name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown（markdownlint-cli2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # lint は 1 回だけ走らせる。npm run fix:md は直せないエラーを出して失敗し、
      # 直せたもの（fix:md をかけ忘れた書式）は git diff で差分を出して失敗する
      - name: lint（npm run fix:md のあと、直った差分が無いか）
        run: |
          status=0
          npm run fix:md || status=$?
          git diff --exit-code || status=1
          exit "$status"

  data:
    name: データ（lint_data.py）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python plugins/detective-conan/scripts/lint_data.py

  scripts:
    name: スクリプトのテスト（unittest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # check_event_copy.py の --cited のテスト。作り物のデータで決まりどおりに出るかと、
      # 今のデータですべての表を読めるか（終了コードが 2 にならないか）を見る
      - run: python -m unittest discover -s tests -v
