name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown（markdownlint-cli2）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: install
        run: npm ci
      - name: lint（npm run lint:md）
        run: npm run lint:md
      # lint が落ちても続けて、npm run fix:md で直る差分を表示する
      - name: format（npm run fix:md で直る差分が無いか）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run fix:md || true
          git diff --exit-code

  data:
    name: データ（lint_data.py）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python plugins/detective-conan/scripts/lint_data.py
